name: Llama

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve latest release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Resolve latest llama.cpp release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/ggml-org/llama.cpp/releases --jq '.[0].tag_name')
          existing_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          release_tag=$tag
          suffix=1
          while grep -Fxq "$release_tag" <<< "$existing_tags"; do
            release_tag="$tag.$suffix"
            ((suffix += 1))
          done
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: ${{ matrix.backend }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            os: windows-latest
          - backend: cuda
            os: ubuntu-latest
          - backend: hip
            os: windows-latest
          - backend: hip
            os: ubuntu-latest
          - backend: vulkan
            os: ubuntu-latest
          - backend: vulkan
            os: windows-latest
          - backend: metal
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
          disable_annotations: true

      - name: Check out llama.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ needs.source.outputs.tag }}
          path: upstream/llama.cpp

      - name: Install CUDA 13.0
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.0.0'
          method: network
          sub-packages: >-
            ${{ runner.os == 'Linux'
              && '["nvcc", "cudart", "crt", "thrust"]'
              || '["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas", "cublas_dev"]' }}
          non-cuda-sub-packages: >-
            ${{ runner.os == 'Linux' && '["libcublas", "libcublas-dev"]' || '[]' }}

      - name: Set up Python for ROCm
        if: matrix.backend == 'hip'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ROCm 10.0
        if: matrix.backend == 'hip'
        shell: bash
        run: |
          python -m pip install \
            --index-url https://stable.repo.amd.com/rocm/whl-next/ \
            "rocm[libraries,devel]==10.0.0"
          rocm-sdk init

          rocm_root=$(rocm-sdk path --root)
          if [[ "$RUNNER_OS" == Windows ]]; then
            rocm_root=$(cygpath -w "$rocm_root")
            rocm_bin="$rocm_root\\bin"
            llvm_root="$rocm_root\\lib\\llvm"
            llvm_bin="$llvm_root\\bin"
            device_lib="$llvm_root\\amdgcn\\bitcode"
          else
            rocm_bin="$rocm_root/bin"
            llvm_root="$rocm_root/lib/llvm"
            llvm_bin="$llvm_root/bin"
            device_lib="$llvm_root/amdgcn/bitcode"
          fi
          {
            printf 'ROCM_PATH=%s\n' "$rocm_root"
            printf 'HIP_PATH=%s\n' "$rocm_root"
            printf 'HIP_PLATFORM=amd\n'
            printf 'HIP_DEVICE_LIB_PATH=%s\n' "$device_lib"
            printf 'LLVM_PATH=%s\n' "$llvm_root"
          } >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$rocm_bin" "$llvm_bin" >> "$GITHUB_PATH"

      - name: Enable Visual Studio 2022 toolset
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'

      - name: Install Ninja
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Install build dependencies on Linux
        if: runner.os == 'Linux' && matrix.backend != 'vulkan'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build

      - name: Install Vulkan build dependencies on Linux
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            glslc \
            libvulkan-dev \
            ninja-build \
            spirv-headers

      - name: Install Vulkan SDK on Windows
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        shell: bash
        run: |
          version=1.4.313.2
          installer="$(cygpath -u "$RUNNER_TEMP")/VulkanSDK-Installer.exe"
          curl.exe -o "$installer" -L \
            "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          "$installer" --accept-licenses --default-answer --confirm-command install
          printf 'VULKAN_SDK=C:\\VulkanSDK\\%s\n' "$version" >> "$GITHUB_ENV"
          printf 'C:\\VulkanSDK\\%s\\bin\n' "$version" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          generator=()
          backend_args=()

          case "$BACKEND" in
            cuda)
              generator=(-G Ninja)
              backend_args+=("-DCMAKE_CUDA_ARCHITECTURES=75-real;86-real;89-real;120a-real")
              ;;
            hip)
              generator=(-G Ninja)
              suffix=
              if [[ "$RUNNER_OS" == Windows ]]; then
                suffix=.exe
              fi
              backend_args+=(
                "-DCMAKE_C_COMPILER=clang$suffix"
                "-DCMAKE_CXX_COMPILER=clang++$suffix"
                "-DGPU_TARGETS=gfx1030;gfx1031;gfx1032;gfx1100;gfx1101;gfx1102;gfx1151;gfx1200;gfx1201"
              )
              ;;
            vulkan)
              generator=(-G Ninja)
              ;;
            metal)
              backend_args+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
              ;;
          esac

          cmake -S cmake -B build "${generator[@]}" \
            -DLLAMA_CPP_SOURCE_DIR="$PWD/upstream/llama.cpp" \
            -DLLAMA_BACKEND="$BACKEND" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=sccache \
            "${backend_args[@]}"

      - name: Build llama and MTMD
        shell: bash
        timeout-minutes: 300
        run: cmake --build build --target llama mtmd --config Release --parallel "$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"

      - name: Package llama and MTMD
        shell: bash
        run: |
          mkdir package
          cp build/bin/*llama.* package/
          cp build/bin/*mtmd.* package/
          tar -C package -czf "$RUNNER_OS-$BACKEND.tar.gz" .

      - name: Stop sccache
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Upload llama
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ matrix.backend }}
          path: ${{ runner.os }}-${{ matrix.backend }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download llama builds
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release
          merge-multiple: true

      - name: Publish llama release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.source.outputs.release_tag }}
          target_commitish: ${{ github.event.repository.default_branch }}
          name: Llama ${{ needs.source.outputs.release_tag }}
          body: Koharu runtime dependency.
          fail_on_unmatched_files: true
          files: release/*.tar.gz
